name: 抖音监控

on:
  schedule:
    - cron: '0 */2 * * *'  # 每2小时运行一次
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许创建Release

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v3
      
      - name: 安装Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 lxml
      
      - name: 下载视频
        run: python download.py
        env:
          USER_URL: ${{ secrets.USER_URL }}
      
      - name: 上传到Release
        uses: softprops/action-gh-release@v1
        if: hashFiles('videos/*.mp4') != ''
        with:
          tag_name: videos-${{ github.run_number }}
          name: 视频备份 ${{ github.run_number }}
          files: videos/*.mp4
          body: |
            自动下载于 ${{ github.event.repository.updated_at }}
            
            点击下方文件名直接下载视频
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 更新下载记录
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add downloaded.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "更新记录" && git push)
